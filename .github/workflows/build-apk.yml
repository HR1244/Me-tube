name: Build MeTube Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web App Production Bundle
        working-directory: app
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        working-directory: app/android
        run: chmod +x gradlew

      - name: Build Signed APK & Prepare OTA Release Assets
        env:
          RUN_NUM: ${{ github.run_number }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          VER_CODE=$((100 + RUN_NUM))
          VER_NAME="2.0.${RUN_NUM}"
          export METUBE_VERSION_CODE="$VER_CODE"
          export METUBE_VERSION_NAME="$VER_NAME"
          cd app/android
          ./gradlew assembleDebug --no-daemon --stacktrace -PMETUBE_VERSION_CODE="$VER_CODE" -PMETUBE_VERSION_NAME="$VER_NAME"
          cd ../..
          APK_OUT="app/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "app/android/app/build/outputs/apk/debug/MeTube.apk" ]; then
            APK_OUT="app/android/app/build/outputs/apk/debug/MeTube.apk"
          fi
          mkdir -p release_assets
          cp "$APK_OUT" release_assets/MeTube.apk
          python3 - <<PY
          import hashlib, json, os, subprocess, time, zipfile
          ver_code = int(os.environ["METUBE_VERSION_CODE"])
          ver_name = os.environ["METUBE_VERSION_NAME"]
          repo = os.environ["REPO_SLUG"]
          bundle_path = "release_assets/ota-bundle.zip"
          dist_dir = os.path.abspath("app/dist")
          with zipfile.ZipFile(bundle_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(dist_dir):
                  for fn in sorted(files):
                      full = os.path.join(root, fn)
                      arc = os.path.relpath(full, dist_dir).replace(os.sep, "/")
                      zf.write(full, arc)
          with open(bundle_path, "rb") as f:
              bundle_bytes = f.read()
          bundle_sha = hashlib.sha256(bundle_bytes).hexdigest()
          bundle_size = len(bundle_bytes)
          apk_size = os.path.getsize("release_assets/MeTube.apk")
          notes = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()[:160]
          manifest = {
              "ota_code": ver_code,
              "ota_version": ver_name,
              "native_version_code": ver_code,
              "title": f"MeTube Update v{ver_name}",
              "notes": notes,
              "has_bundle": True,
              "bundle_url": f"https://github.com/{repo}/releases/download/latest/ota-bundle.zip",
              "bundle_size": bundle_size,
              "sha256": bundle_sha,
              "has_apk": True,
              "apk_url": f"https://github.com/{repo}/releases/download/latest/MeTube.apk",
              "apk_size": apk_size,
              "updated_at": int(time.time()),
          }
          with open("release_assets/ota-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload MeTube APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeTube-APK
          path: release_assets/MeTube.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Public Auto-Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release_assets/MeTube.apk release_assets/ota-bundle.zip release_assets/ota-manifest.json --clobber
            gh release edit latest --title "MeTube Latest Auto-Update (v2.0.${{ github.run_number }})" --notes "Automatic latest build for in-app 1-click self-update."
          else
            gh release create latest release_assets/MeTube.apk release_assets/ota-bundle.zip release_assets/ota-manifest.json \
              --title "MeTube Latest Auto-Update (v2.0.${{ github.run_number }})" \
              --notes "Automatic latest build for in-app 1-click self-update." \
              --target main
          fi
